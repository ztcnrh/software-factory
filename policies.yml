# policies.yml — gate policies. The factory consults these at every human_gate.
#
# Default posture is conservative: require a human. The Retro station (the
# learning loop) proposes new auto-approve rules here based on your intervention
# history. You approve a rule ONCE by filling in `approved_by`; thereafter every
# matching work item passes that gate untouched. This file is the lever that
# raises the "shipped without human intervention" metric over time — each rule
# you approve permanently removes a class of work from your plate.
version: 1
default: require_human

# Each rule: if a work item reaching `gate` matches every condition in `when`,
# apply `decision` automatically instead of pausing for a human — but ONLY once
# `approved_by` is set (a retro-proposed rule sits dormant until you sign it).
#
# Rule shape (validated at load — `factory init` rejects a malformed file):
#   id           short identifier, used in logs/metrics
#   gate         the human gate this attaches to, e.g. spec_review / ship_review  [required]
#   decision     verdict to apply, e.g. `approved` — must be a real verdict for
#                that gate in line.yml                                            [required]
#   when         conditions; ALL must hold. These are the ONLY valid keys —       [required]
#                an unknown key is a load error, so a typo can't silently widen a
#                rule to match everything:
#                  labels_any: [a, b]   item has at least one of these labels
#                  labels_all: [a, b]   item has every one of these labels
#                  max_risk:   low      triage risk must be <= this  (low|medium|high|unknown)
#                To match EVERY item at the gate on purpose, set `when: all`
#                (rare — if you truly want no human there, drop the gate in line.yml).
#   approved_by  set to your name to ACTIVATE; null/absent = dormant
#   rationale / proposed_by / created   free-form provenance the retro station fills in
rules: []

# --- Example of a rule the Retro station might propose (left commented) -------
# rules:
#   - id: auto-approve-docs-spec
#     gate: spec_review
#     when:                       # ALL conditions must hold for the work item
#       labels_any: [docs, documentation]
#       labels_all: [reviewed]    # (illustrative) EVERY listed label must be present
#       max_risk: low             # triage-assigned risk must be <= this
#     decision: approved
#     rationale: "12/12 docs-only specs were approved unchanged in the last 30 days."
#     proposed_by: retro
#     created: 2026-06-27
#     approved_by: null           # <- set to your name to ACTIVATE this rule
