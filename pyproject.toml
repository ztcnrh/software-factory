[project]
name = "software-factory"
version = "0.7.0"
description = "A GitHub-native software factory: issues are work items, labels are state, claude -p is the runtime."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
factory = "factory.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
