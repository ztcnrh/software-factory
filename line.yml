# line.yml — the factory line definition.
#
# This is the SINGLE SOURCE OF TRUTH for the conveyor: the stations, the
# routing between them, and where humans gate. The Python engine (src/factory)
# loads this file; the GitHub Actions layer reads the same file. Reshape your
# factory by editing here — add a station, change a route, move a gate.
#
# It is a faithful encoding of the factory loop diagram:
#   triage -> (spec | implement | needs_human | parked)
#   spec -> spec_review(human) -> implement
#   implement -> code_review -> verify -> ship_review(human) -> deploy -> done
#
# `ship_review` approval == merging the PR; that merge triggers the project's
# post-merge CI/CD (build + deploy, with a health-wait baked in). `deploy` is the
# single external station that watches that workflow: green == shipped -> done.
# Continuous monitoring + auto-spawn is deferred (see docs/OPTIMIZATION-AREAS.md);
# intake is `factory new` or the `factory intake` sensor (labeled GitHub issues
# filed into triage), not a monitor loop.

version: 1

# The headline objective the whole factory optimizes toward. Every other
# component (metrics, policies, the retro station) serves this number.
north_star: >
  Maximize the one-shot ship rate: the share of changes that ship without any
  human rework — no send-back, no correction, no unblock — at an acceptable cost
  per change. The human stays in the loop and owns the ship decision; the goal is
  not to remove human review but to make the line good enough that review becomes
  a rubber-stamp. Raise this share over time by learning from every human step-in.

# Every state a work item can occupy. `kind` is one of:
#   station     -> an agent does the work, then emits a verdict that routes it
#   human_gate  -> the factory pauses and waits for a human decision
#   terminal    -> an end state
# `skill`/`agent` name the Claude Code skill + subagent that run a station.
# A station with no skill/agent is "external" (CI/CD, deploy) — driven by a
# configured shell command locally, or by GitHub Actions in cloud mode.
# `checking: true` marks a station as a checker of other stations' work. The
# engine surfaces it on the NEXT directive and the station brief, and the driver
# protocol keys isolation on it: a checking station always runs in a fresh
# context and never receives chat steering — it converges on the spec and the
# persisted artifacts alone.
states:
  triage:       {kind: station,    skill: factory-triage,      agent: factory-triage}
  spec:         {kind: station,    skill: factory-spec,        agent: factory-spec}
  spec_review:  {kind: human_gate, gate: spec_review,
                 prompt: "Review the spec. Approve to implement, or send back for revision."}
  implement:    {kind: station,    skill: factory-implement,   agent: factory-implement}
  code_review:  {kind: station,    skill: factory-code-review, agent: factory-code-review,
                 checking: true}
  verify:       {kind: station,    skill: factory-verify,      agent: factory-verify,
                 checking: true}
  ship_review:  {kind: human_gate, gate: ship_review,
                 prompt: "Review the code and verification output. Ready to ship?"}
  # `deploy` is external (no agent): the post-merge CI/CD workflow. `ships_on`
  # names the verdict that means "the change went live" — the declarative anchor
  # for the North Star `shipped` metric, so the engine isn't hardcoded to a
  # tail-state name (see dispatch.advance / line.ships_on).
  deploy:       {kind: station,    external: true, ships_on: succeeded}
  needs_human:  {kind: human_gate, gate: needs_human,
                 prompt: "Triage needs your clarification to proceed."}
  # `blocked` is reachable two ways: the explicit `blocked` verdict routed below
  # (spec, implement), AND an "escape hatch" — ANY station can force an item here
  # by setting `human_required` on its report, bypassing the routing table. So the
  # routes below are not the only way in; every station can block. Either arrival
  # counts as a human step-in against the North Star. See dispatch.advance().
  blocked:      {kind: human_gate, gate: blocked,
                 prompt: "A station is blocked and needs your help."}
  parked:       {kind: terminal,   revivable: true}
  done:         {kind: terminal}

start: triage

# The live loop circuit-breaker: a station may complete this many runs within one
# "human epoch" — the stretch since the last human gate decision, correction, or
# revive. The next *automated* route back into it lands the item at the blocked
# gate instead of looping again, so an implement↔code_review ping-pong stops
# burning tokens and gets a human decision. A human send-back opens a fresh epoch
# (new guidance deserves a fresh budget), and lifetime attempts stay on the item
# for the retro's churn signal. Override per station with `max_attempts` on its
# entry; delete this key to run uncapped.
max_attempts: 4

# Routing: for each state, verdict -> next state.
# Station verdicts come from the StationReport the agent emits; human-gate
# verdicts are the human's decision. Keep this aligned with the diagram.
routing:
  triage:
    needs_spec: spec
    automatable: implement
    needs_human_clarification: needs_human
    park: parked
  spec:
    ready_for_review: spec_review
    blocked: blocked
  spec_review:
    approved: implement
    needs_revision: spec
    park: parked                   # human shelves it (recorded, revivable) — the gate's "halt"
  implement:
    implemented: code_review
    blocked: blocked
  code_review:
    pass: verify
    changes_requested: implement
  verify:
    verified: ship_review
    failed: ship_review            # verification output always goes to the human gate
  ship_review:
    approved: deploy               # approve == merge the PR, which kicks off CI/CD
    not_ready: code_review         # the diagram's "Not ready" loop
    park: parked                   # human shelves it (recorded, revivable) — the gate's "halt"
  deploy:
    succeeded: done                # post-merge CI/CD went green (build + deploy + health-wait)
    failed: code_review            # deploy failed — back into the code loop
  needs_human:
    provided: triage
    park: parked
  blocked:
    unblocked: triage
    park: parked
  parked:
    revive: triage                 # default re-entry (`factory revive`); the engine records the
                                   # pre-park state, and `revive --resume` re-enters there instead
